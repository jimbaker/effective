[project]
name = "rosetta"
version = "0.1.0"
description = "One retrieval program ported to Effective, DSPy, Pydantic AI and LangGraph, and measured"
requires-python = ">=3.14"
dependencies = [
    "effective",
    "dspy>=3.0",
    "pydantic-ai-slim>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "pytest>=8.0",
    "pydantic-ai-harness>=0.54.0",
]

[tool.uv]
package = false
exclude-newer = "7 days ago"

[tool.uv.sources]
effective = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

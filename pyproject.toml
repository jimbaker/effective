[project]
name = "effective"
version = "0.1.0"
description = "Agentic workflows as plain Python generators: composable, replayable, and durable. Model calls, Jev judgments, tools, and human approvals are typed ops."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jim Baker", email = "jim.baker@python.org" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
    # Bounded: `ast-grep-cli` in the dev group must stay on the same series. Bump the two
    # together.
    "ast-grep-py>=0.42.0,<0.43",
    # The semantic rung above ast-grep: jedi resolves bindings where ast-grep matches shapes.
    "jedi>=0.20.0",
    "absurd-sdk>=0.5.0",
    # Exact pin: the 0.0.x API is in flux; bump deliberately and re-run the conformance probes.
    "pydantic-monty==0.0.18",
    # The markup t-string seam (`effective.graphlayout.svg`). Exact pin: the 0.1.x API is in
    # flux, and the vendored copy at infra/tdom carries one patch.
    "tdom==0.1.17",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.3",
    "openai>=2.38.0",
    # `effective.cards.render_shiny` lowers a CardSpec into an htmltools tag tree.
    "htmltools>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/jimbaker/effective"
Repository = "https://github.com/jimbaker/effective"

[project.optional-dependencies]
# The terminal surface (`src/tui`). Optional because the substrate renders the run view as text
# and Mermaid with no dependency; textual and rich buy the interactive shell.
tui = [
    "textual>=8.2",
    "rich>=15.0",
]
# The arrivals bridge: a separate process that carries an outside source's delivery semantics
# into a durable event. It answers an op rather than yielding one, so it is an extra. The server
# is pinned by digest at `infra/redis-test/PIN.txt`.
bridge = [
    "redis>=8.1",
]
# Typed judgments from TypeSafe's models (Jev), an interpreter that answers an op.
judge = [
    "typesafe-sdk==0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "httpx>=0.28",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0.3",
    # The extras, so their tests run rather than import-skip.
    "effective[tui]",
    "effective[bridge]",
    "effective[judge]",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    # Co-versioned with the `ast-grep-py` binding above; `scripts/whouses.py` shells to it.
    "ast-grep-cli>=0.42.0,<0.43",
]

[tool.ty.environment]
# src/ and tests/ are first-party roots (tests import shared helpers like `_durable` directly,
# as pytest does); "." lets `scripts.*` resolve.
python-version = "3.14"
root = ["src", "tests", "."]

[tool.ty.src]
# The coder fixture's test imports `mod` by its in-sandbox name.
exclude = ["src/examples/coder/fixture/test_mod.py"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts callables in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# Always run with coverage: every pytest invocation reports it (the discipline). The
# 90% *gate* is enforced only by `just cov` — the full suite against the test Postgres,
# because the durable code paths (AbsurdHandler, the SQLite engine) need a real backend
# to execute. A bare `--no-cov` opts an ad-hoc run out.
addopts = "--strict-markers --cov=effective --cov-report=term-missing"
# Test roles: the role decides what a passing run proves and which rules apply. "Minimize
# overlap" is a unit-role rule, and wrong for the conformance suites, whose overlap is the product.
# A test that declares no role is marked `unit` by `tests/conftest.py`.
markers = [
    "unit: one seam in isolation; overlap with another unit test is waste",
    "spine: the pieces compose — overlap with unit tests is the deliverable, not waste",
    "journey: a realistic path end to end; a pass means the path works",
    "adversarial: an attack — a pass means only that it FAILED, so this role owes a mutation check",
    "conformance: one model, many interpreters; overlap across arms is the design",
]

[tool.coverage.run]
source = ["effective"]

[tool.coverage.report]
# No fail_under here — it would fire on the infra-free `test-core` run, where the durable
# paths are unexecuted. Enforced via `--cov-fail-under=90` in `just cov` instead.
show_missing = true
skip_covered = false

[tool.uv]
default-groups = ["dev"]
# Supply-chain hardening: never resolve to package versions published in the last 7 days.
exclude-newer = "7 days ago"

[tool.uv.sources]
# Vendored: infra/tdom is tdom 0.1.17's sdist plus one patch (infra/tdom/patches). Upstream's
# `TemplateParser.close` judges its buffer before telling the parser input has ended, which
# CPython 3.14.7's batching `HTMLParser.feed` turns into a false parse error on a well-formed
# template. infra/tdom/PIN.txt is the co-versioning record and the un-vendor procedure.
tdom = { path = "infra/tdom" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effective", "src/agent", "src/tui"]

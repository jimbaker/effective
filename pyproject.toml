[project]
name = "effective"
version = "0.1.0"
description = "Build agentic workflows from composable Python generators. A handler records each model call, Jev judgment, tool, and human approval, so a run is replayable and durable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jim Baker", email = "jim.baker@python.org" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "absurd-sdk>=0.5.0",
    # Exact pin: the code engine's entry path and its clock policy follow this API, so a bump
    # re-runs the engine's suites and the coverage probe.
    "pydantic-monty==1.1.0",
    # The markup t-string seam (`effective.graphlayout.svg`). Exact pin: the 0.1.x API is in
    # flux, and the vendored copy at infra/tdom carries one patch.
    "tdom==0.1.17",
    "sqlmodel>=0.0.47",
    "alembic>=1.14",
    # The pure-Python build, over the system libpq; the `binary` extra bundles one.
    "psycopg>=3.3",
    "openai>=3.24.0",
    # `effective.cards.render_shiny` lowers a CardSpec into an htmltools tag tree.
    "htmltools>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/jimbaker/effective"
Repository = "https://github.com/jimbaker/effective"

[project.optional-dependencies]
# The terminal surface (`src/tui`). Optional because the substrate renders the run view as text
# and Mermaid with no dependency; textual and rich buy the interactive shell.
tui = [
    "textual>=8.2",
    "rich>=15.0",
]
# The arrivals bridge: a separate process that carries an outside source's delivery semantics
# into a durable event. It answers an op rather than yielding one, so it is an extra. The server
# is pinned by digest at `infra/redis-test/PIN.txt`.
bridge = [
    "redis>=8.1",
]
# Typed judgments from TypeSafe's models (Jev), an interpreter that answers an op.
judge = [
    "typesafe-sdk==0.7.2",
]
# The coding machine's handler half: the lint, the merge gate and the structural edits. The yielding
# half and the rest of the substrate import neither, so a consumer that runs workflows installs no
# parser, and an install on free-threaded CPython stays possible: ast-grep-py ships no free-threaded
# wheel.
coding = [
    # Bounded: `ast-grep-cli` in the dev group runs the same release as this binding. Bump the
    # two together.
    "ast-grep-py>=0.45.3,<0.46",
]
# psycopg's own libpq, for a machine without one. It ships no free-threaded wheel, so the core
# takes the pure-Python build. Named directly rather than as `psycopg[binary]`, which the override
# below rewrites. psycopg runs a binary build of another release without a check, so the two move
# together, and `tests/test_core_install.py` holds the lock to one version of both.
binary = [
    "psycopg-binary>=3.3",
]

[dependency-groups]
# What the race suites need beside the core, so `just race-free-threaded` installs exactly the
# core and this on free-threaded CPython. The dev group includes it, so the ranges live once.
race = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    # The conftest provisions a database per worker, so it reads xdist's options.
    "pytest-xdist>=3.8.0",
]
dev = [
    { include-group = "race" },
    # The lint and the coding machine's tools, which `just check` runs.
    "effective[coding]",
    "effective[binary]",
    "ruff>=0.16.10",
    "httpx>=0.28",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0.3",
    # The link gates (`scripts/link_check.py`, `scripts/wiki_lint.py`) read links as markdown
    # renders them.
    "markdown-it-py>=4.2",
    # The extras, so their tests run rather than import-skip.
    "effective[tui]",
    "effective[bridge]",
    "effective[judge]",
    "pytest-randomly>=5.0.0",
    # Co-versioned with the `ast-grep-py` binding above; `scripts/whouses.py` shells to it.
    "ast-grep-cli>=0.45.3,<0.46",
]

[tool.ty.environment]
# src/ and tests/ are first-party roots (tests import shared helpers like `_durable` directly,
# as pytest does); "." lets `scripts.*` resolve.
python-version = "3.14"
root = ["src", "tests", "."]

[tool.ty.src]
exclude = [
    # The coder fixture's test imports `mod` by its in-sandbox name.
    "src/examples/coder/fixture/test_mod.py",
    # A uv project of its own: DSPy, Pydantic AI and LangGraph resolve only in the environment
    # `uv run --project examples/rosetta` builds, so the root checker cannot see them.
    "examples/rosetta",
]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts callables in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# Always run with coverage: every pytest invocation reports it (the discipline). The
# 90% *gate* is enforced only by `just cov` — the full suite against the test Postgres,
# because the durable code paths (AbsurdHandler, the SQLite engine) need a real backend
# to execute. A bare `--no-cov` opts an ad-hoc run out.
addopts = "--strict-markers --cov=effective --cov-report=term-missing"
# Test roles: the role decides what a passing run proves and which rules apply. "Minimize
# overlap" is a unit-role rule, and wrong for the conformance suites, whose overlap is the product.
# A test that declares no role is marked `unit` by `tests/conftest.py`.
markers = [
    "unit: one seam in isolation; overlap with another unit test is waste",
    "spine: the pieces compose — overlap with unit tests is the deliverable, not waste",
    "journey: a realistic path end to end; a pass means the path works",
    "adversarial: an attack — a pass means only that it FAILED, so this role owes a mutation check",
    "conformance: one model, many interpreters; overlap across arms is the design",
    "property: a law over a generated domain; it owes the corners its seeds reach and a mutant only it detects",
]

[tool.coverage.run]
source = ["effective"]

[tool.coverage.report]
# No fail_under here — it would fire on the infra-free `test-core` run, where the durable
# paths are unexecuted. Enforced via `--cov-fail-under=90` in `just cov` instead.
show_missing = true
skip_covered = false

[tool.uv]
default-groups = ["dev"]
# Supply-chain hardening: never resolve to package versions published in the last 7 days.
exclude-newer = "7 days ago"
# absurd-sdk asks for `psycopg[binary]`. The core takes psycopg's pure build over the system
# libpq, which is the one free-threaded CPython can install, and the `binary` extra grants the
# bundled libpq where a machine has none. The override replaces every requirement on psycopg, an
# extra included, so a psycopg extra is named here as its own package, as `binary` is.
override-dependencies = ["psycopg>=3.3"]

[tool.uv.sources]
# Vendored: infra/tdom is tdom 0.1.17's sdist plus one patch (infra/tdom/patches). Upstream's
# `TemplateParser.close` judges its buffer before telling the parser input has ended, which
# CPython 3.14.7's batching `HTMLParser.feed` turns into a false parse error on a well-formed
# template. infra/tdom/PIN.txt is the co-versioning record and the un-vendor procedure.
tdom = { path = "infra/tdom" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effective", "src/agent", "src/tui"]
